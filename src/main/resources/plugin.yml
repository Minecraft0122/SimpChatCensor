name: SimpChatCensor
version: 3.0.1
main: com.simpchatcensor.SimpChatCensorPlugin
api-version: '1.21'
folia-supported: true
authors:
  - GPT-5.5
  - Minecraft0122
  - SimpFun
description: Realtime chat and command censor with fuzzy matching and IP/domain detection.
commands:
  scc:
    description: Manage SimpChatCensor.
    usage: /scc <reload|add|remove|list|geoip|whitelist>
    permission: simpchatcensor.admin
permissions:
  simpchatcensor.admin:
    description: Allows managing SimpChatCensor.
    default: op
  simpchatcensor.bypass:
    description: Bypasses censor checks.
    default: op
  simpchatcensor.notify:
    description: Receives staff notifications for violations.
    default: op
