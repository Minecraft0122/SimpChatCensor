  # 是否启用 GeoIP 国家/地区检测。
  # 这个功能只用于“玩家登录 IP 的国家/地区限制”，不是聊天内容过滤的核心。
  # 通常只有服务器遭遇特定地区攻击，或明确需要来源地白名单/黑名单时才建议开启。
  geoip-enabled: false
  # GeoIP 数据库文件名，路径相对于 plugins/SimpChatCensor/。
  geoip-database: "GeoLite2-Country.mmdb"
  # /scc geoip update 使用的下载地址。
  # 默认使用 P3TERX/GeoLite.mmdb 的 latest GeoLite2-Country.mmdb。
  geoip-download-url: "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb"
  # GeoIP 国家黑名单；可写中文名、英文名或 ISO 代码，取决于数据库返回值。
  blocked-countries: ["朝鲜", "伊朗"]
  # GeoIP 国家白名单；非空时只允许这些国家/地区，优先级高于黑名单。
  allowed-countries: []
  # 域名白名单；允许精确域名及其子域名，例如 minecraft.net 会允许 auth.minecraft.net。
  domain-whitelist: ["minecraft.net"]
  # IP/域名违规时的处理动作；未配置时使用顶部 action。
  action: cancel
