# SimpChatCensor 配置文件
# 支持的处理动作:
#   cancel = 拦截消息/命令
#   filter = 替换命中的内容后继续发送
#   warn   = 只警告玩家，不拦截
#   kick   = 踢出玩家

# 默认违规处理动作。
action: cancel

# 是否把 message-blacklist.yml 中的条目当作正则表达式。
# false 时使用普通字符串包含匹配，性能更稳。
use-regex: false

# 是否启用高级预处理。
# 可识别 Unicode 兼容字符、变音符号、Leet 写法和空白拆分，例如 f u c k。
advanced-preprocess: true

# 是否检测玩家执行的命令内容。
filter-commands: true

# 命令内容免检白名单。建议只写根命令，不带 / 或参数；兼容带 / 和 Bukkit 命名空间的写法。
# 比较时会忽略大小写并剥离 Bukkit 命名空间。
# 未列出的命令在 filter-commands 为 true 时仍会检测；显式写成 [] 可让所有命令参与检测。
command-whitelist:
  - bwf
  - lp
  - luckperms

# 硬性限制同一玩家连续发送受限内容的最小间隔，没有单独关闭开关。
# 聊天和命令共用同一条活动记录，命令白名单与 simpchatcensor.bypass 不受此限制。
# 命令间隔受 filter-commands 总开关控制；关闭该开关会关闭整套命令检测。
content-minimum-interval:
  # 两次聊天之间至少间隔 800 毫秒。
  message-millis: 800
  # 两次非白名单命令之间至少间隔 250 毫秒。
  command-millis: 250

# 聊天刷屏检测。刷屏违规始终取消当前消息，不受顶部 action 的 filter/warn 设置影响。
spam-detection:
  enabled: true
  # 同一玩家在此时间内重复发送完全相同的上一条消息会被拦截。
  duplicate-window-seconds: 5
  similar-message:
    enabled: true
    # 最近两条消息在此窗口内共享足够长的前缀、但只改变短尾部时拦截，专门防止随机后缀绕过。
    window-seconds: 8
    minimum-common-prefix-length: 12
    maximum-suffix-length: 64
  repeated-content:
    enabled: true
    # 同一片段连续出现至少 4 次，且重复总长度达到 12 个 Java 字符时拦截。
    min-repeats: 4
    min-segment-length: 1
    max-segment-length: 16
    min-total-length: 12
  long-message-burst:
    enabled: true
    # 10 秒内发送 3 条至少 300 个 Java 字符的消息时拦截第 3 条及后续消息。
    min-length: 300
    max-messages: 3
    window-seconds: 10

# 是否把违规记录通知给拥有 simpchatcensor.notify 权限的管理员。
notify-staff: true

# 是否写入 plugins/SimpChatCensor/violations/YYYY-MM-DD.log。
# 每天一个文件，记录时间、玩家 ID（游戏名）、检测类型、规则和原始内容，不记录 UUID。
log-to-file: true

# 管理员通知消息。
# 可用变量: %player%, %type%, %match%, %rule%, %detail%
staff-message: "&c[SimpChatCensor] &f%player% &7触发 &e%type%&7: &f%match%"

# 违禁关键词、正则、IP/域名等内容被拦截或警告时，玩家收到的提示。
player-warning: "&c请不要发送违规内容。"

# 刷屏或发言过快被拦截时，玩家收到的独立提示；不会复用 player-warning。
spam-warning: "&e消息发送过快，请稍后再试。"

# action 为 kick，或登录 IP/GeoIP 被拦截时使用的踢出消息。
kick-message: "&c你因发送违规内容被移出服务器。"

# 拼音模糊匹配。
# 开启后可让“你妈”和“你嘛/你吗”、“卧槽”和“窝操”这类同音变体互相命中。
# 中文服通常建议开启；如果误报偏多，可以再改为 false。
fuzzy-pinyin:
  # 是否启用拼音匹配。
  enabled: true
  # 多音字组合上限，越高越准但越耗时。
  max-combinations: 32

# 编辑距离模糊匹配。
# 用来识别少量拼写变体，例如 fuck -> fack。
fuzzy-levenshtein:
  # 是否启用编辑距离匹配。
  enabled: false
  # 全局最大编辑距离；建议保持 1，避免误伤正常单词。
  global-threshold: 1
  # 单条消息最多计算次数，防止超长消息造成性能压力。
  max-checks-per-message: 50

# IP/域名检测。
# 主要用于拦截广告、外部服务器地址、内网地址泄露。
ip-domain-detection:
  # 是否启用 IP/域名检测。
  enabled: true
  # 是否检测 IPv4 地址，例如 192.168.1.1。
  # 同时会识别逗号、中文逗号、中文句号等混淆分隔符，例如 1,1,1,1。
  check-ipv4: true
  # 是否检测完整 IPv6 地址；默认开启，白名单中的地址除外。
  check-ipv6: true
  # 是否检测域名、子域名、端口和路径，例如 mc.example.com:25565。
  # 同时会识别逗号、中文标点等混淆分隔符，例如 cnpvp,top。
  # 只有最后的域名后缀在此列表中时才会命中，用于减少普通带点文本的误判。
  # 可写顶级后缀（com）或多级后缀（co.uk），不带前导点；显式 [] 会关闭所有域名后缀匹配。
  check-domains: true
  domain-suffixes: ["com", "net", "org", "cn", "top", "xyz", "cc", "me", "tv", "io", "co", "info", "biz", "app", "dev", "gg", "live", "shop", "site", "online", "vip", "pro", "link", "club"]
  # 是否启用 GeoIP 国家/地区检测。
  # 这个功能只用于“玩家登录 IP 的国家/地区限制”，不是聊天内容过滤的核心。
  # 通常只有服务器遭遇特定地区攻击，或明确需要来源地白名单/黑名单时才建议开启。
  geoip-enabled: false
  # GeoIP 数据库文件名，路径相对于 plugins/SimpChatCensor/。
  geoip-database: "GeoLite2-Country.mmdb"
  # /bwf geoip update 使用的下载地址。
  # 默认使用 P3TERX/GeoLite.mmdb 的 latest GeoLite2-Country.mmdb。
  geoip-download-url: "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb"
  # GeoIP 国家黑名单；可写中文名、英文名或 ISO 代码，取决于数据库返回值。
  blocked-countries: ["朝鲜", "伊朗"]
  # GeoIP 国家白名单；非空时只允许这些国家/地区，优先级高于黑名单。
  allowed-countries: []
  # 域名白名单；允许精确域名及其子域名，例如 minecraft.net 会允许 auth.minecraft.net。
  domain-whitelist: ["minecraft.net"]
  # IP/域名违规时的处理动作；未配置时使用顶部 action。
  action: cancel
